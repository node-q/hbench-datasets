# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/fdic-banking/1.0.1
title: US bank totals by year and state, 1934 to 2025
summary: 'Bank analysis on the FDIC''s public yearly totals for insured banks: profitability, capital, funding, loan
  quality, growth, consolidation, state rankings, and checks of the tables against themselves.'
description: 'Each task gives the AI real yearly totals for FDIC-insured institutions, by year, state and charter
  class, with the FDIC''s own definition of every field. The question states the years and the formula of every ratio
  it asks for, and the AI gives exact figures: a ratio, a growth rate, a ranking, a count, or whether the tables agree
  with themselves. Every field of the answer is checked, and a task passes only when all of them are right.'
domain: Finance
group: finance
format: field-graded
status: draft
trade: bank analysts
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The FDIC's data are not
    under this licence, and the FDIC states no licence for them.
upstream:
  name: BankFind Suite API, summary of historical annual aggregates of FDIC-insured institutions
  by: Federal Deposit Insurance Corporation (FDIC)
  url: https://api.fdic.gov/banks/docs/
families:
- kind: profitability
  name: Profitability
  what: Return on assets and on equity, with balances averaged as the question says.
- kind: capital
  name: Capital
  what: Equity and tangible equity to assets, and dividends against earnings.
- kind: funding-liquidity
  name: Funding and liquidity
  what: Loans to deposits, the mix of deposits, and where new deposits went.
- kind: income-structure
  name: Income structure
  what: Net interest and noninterest income, the efficiency ratio and the net interest margin.
- kind: asset-quality
  name: Asset quality
  what: Past-due and noncurrent loans, charge-offs, provisions and the allowance.
- kind: growth
  name: Growth
  what: Year-on-year and compound growth rates over the spans the question states.
- kind: consolidation
  name: Consolidation
  what: The numbers of banks, branches and offices over time and by state.
- kind: charter-comparison
  name: Charter comparison
  what: Commercial banks against savings institutions, adding the two charter classes up or keeping them apart as
    asked.
- kind: state-ranking
  name: State rankings
  what: States ranked by assets, deposits or return, and their shares of the national total, with no totals row
    counted as a state.
- kind: document-check
  name: Data check
  what: Whether the rows and fields add up and tie out, and which breaks are real and which rows only look wrong.
you_get:
- title: Every test task
  detail: Each with the data it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: fdic-banking-roa-01
