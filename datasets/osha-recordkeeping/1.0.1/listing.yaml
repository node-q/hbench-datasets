title: OSHA injury and illness recordkeeping
summary: 'Keep workplace injury records under the US OSHA recordkeeping regulation: what is recordable, where it goes on
  the log, day counts, hearing loss, annual summaries, deadlines, severe injury reports and electronic submission.'
description: 'Each task says what happened to unnamed employees at an unnamed workplace: injuries, treatment, dates, the
  workplace''s size and industry, hearing test results. The AI reads OSHA''s regulation on recording and reporting injuries
  and illnesses, 29 CFR Part 1904, and answers what it decides: whether an injury is recordable, where it goes on the log,
  how many days count, which deadline applies, or who must keep and submit records. Every field of the answer is checked,
  and a task passes only when all of them are right.'
domain: Employment law
group: law-compliance
format: field-graded
status: draft
trade: safety managers
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The regulation is a US government
    work.
upstream:
  name: 29 CFR Part 1904, Recording and Reporting Occupational Injuries and Illnesses
  by: Occupational Safety and Health Administration, US Department of Labor, as the eCFR shows it
  url: https://www.ecfr.gov/current/title-29/part-1904
families:
- kind: work-relatedness
  name: Work-relatedness
  what: Whether an injury or illness is work-related, applying the listed exceptions and their limits, travel and work at
    home.
- kind: general-criteria
  name: Recording criteria
  what: First aid against medical treatment, and the other general criteria that make an injury or illness recordable.
- kind: log-entries
  name: Log entries
  what: Which space of the OSHA 300 Log an entry is checked in, the special entries, privacy concerns and whose log it goes
    on.
- kind: day-counts
  name: Day counts
  what: Days away from work and days of restriction or transfer, counted on calendar days with the cap and the stops.
- kind: hearing-loss
  name: Hearing loss
  what: The standard threshold shift and the 25-decibel level, ear by ear, with revised baselines and retests.
- kind: annual-summary
  name: Annual summary
  what: A year's column totals for the annual summary, from a list of events.
- kind: record-deadlines
  name: Recordkeeping deadlines
  what: The dates for entering, posting, certifying, keeping and giving copies of the records.
- kind: severe-injury-reporting
  name: Severe injury reports
  what: Which fatalities, in-patient hospitalizations and amputations must be reported, and by when.
- kind: partial-exemption
  name: Partial exemption
  what: Which establishments are exempt from keeping records, by company size and by industry.
- kind: electronic-submission
  name: Electronic submission
  what: Which establishments submit which forms electronically, and by when.
you_get:
- title: Every test task
  detail: Each with the text of the regulation it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: osha-recordkeeping-first-aid-01
