# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/eo-oh/1.0.1
title: Ohio professional liability rating
summary: 'Rate one insurer''s errors and omissions program in Ohio from its filed manuals and forms: base premiums, rating
  factors, limits, endorsements, extended reporting, cyber, claims-made coverage and Ohio''s own rules.'
description: 'Each task gives the AI the rating manuals one insurer filed in Ohio for its professional liability program,
  for lawyers, accountants, architects and engineers, and other professionals, with the policy forms where a question needs
  them. The question states the facts, such as a firm''s revenue or a claim''s dates, and asks for exact values: a premium,
  a factor, whether a claim is covered, or the errors in the documents themselves. Every field of the answer is checked,
  and a task passes only when all of them are right.'
domain: Insurance
format: field-graded
status: draft
trade: underwriters
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays
    the filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: base-premium
  name: Base premium
  what: Base premiums built up by revenue range, rounded per range, from Ohio's rates where they replace the manual's.
- kind: lawyers-rating
  name: Lawyers' rating
  what: The base premium per lawyer with the size of firm factor and support staff, and the prior acts factor averaged over
    the firm.
- kind: rating-factor
  name: Rating factors
  what: Each profession's rating factors from the right column, including commission, policy length and prior acts from
    retroactive dates.
- kind: limit-deductible
  name: Limits and deductibles
  what: Per claim and aggregate limit and deductible factors, interpolated where the tables require it.
- kind: minimum-premium
  name: Minimum premium
  what: The minimum premium for each profession, and the step of the premium where it applies.
- kind: endorsement-premium
  name: Endorsement premium
  what: Defense, employment practices, privacy and other endorsement premiums, and the factors of endorsements read from
    the attached forms.
- kind: full-premium
  name: Full premium
  what: A firm's premium worked through every step, starting with its revenue and ending with the final premium.
- kind: erp
  name: Extended reporting
  what: Extended reporting period factors and premiums from the right table, for a firm, a departing lawyer or a short term.
- kind: cyber
  name: Cyber endorsement
  what: Cyber endorsement premiums by revenue band and limit, its options, and who may buy it.
- kind: coverage
  name: Claims-made coverage
  what: Whether a claim is covered under the claims-made and reported trigger, with retroactive dates, extended reporting
    and endorsements read from the forms.
- kind: ohio-exception
  name: Ohio's own rules
  what: The rules Ohio's state exceptions replace, such as experience rating and renewal capping, applied in place of the
    manual's.
- kind: policy-rule
  name: Policy rules
  what: Cancellation, suspension, installment, rate lock and multi-year rules applied as filed.
- kind: schedule-rating
  name: Schedule rating
  what: Ohio's limits for each characteristic and in total, and other states' notes in the manual.
- kind: document-check
  name: Checking the documents
  what: The manuals' own inconsistencies, told apart from worked examples and tables that are right.
you_get:
- title: Every test task
  detail: Each with the filed manuals and forms it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: eo-oh-accountants-base-premium-01
