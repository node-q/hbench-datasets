# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/underwriting-starter/1.0.1
title: Underwriting starter
summary: 'Everyday underwriting work on nine lines of business in Ohio: full premiums, table lookups, schedule rating, minimums,
  endorsements, eligibility, state exceptions, claims-made tails, return premiums and errors in filed manuals.'
description: 'Each task gives the AI the filed rate and rule documents it needs, from public filings for one line of business,
  and states its facts in the question. It asks for exact values: a premium, a factor, a rule, or the errors in the documents
  themselves. The lines run through commercial property, general liability, professional and medical liability, personal
  auto, pet, farm, contract surety and title. Every field of the answer is checked, and a task passes only when all of them
  are right.'
domain: Insurance
format: field-graded
status: draft
trade: underwriters
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays the
    filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: full-premium
  name: Full premium
  what: The whole rating chain, through base rate, factors, limits and deductibles, to the final premium.
- kind: table-lookup
  name: Table lookup
  what: The right cell of a rate or factor table by class, band or tier, interpolating where the filing says to.
- kind: schedule-rating
  name: Schedule rating
  what: Debits and credits for a risk, held to each characteristic's limit and the state's total cap.
- kind: minimum-premium
  name: Minimum premium
  what: When the premium the rules produce falls under a minimum, and what follows.
- kind: endorsement
  name: Endorsement premium
  what: 'The charge for an endorsement: flat, per limit, a percentage, or subject to its own minimum.'
- kind: eligibility-rules
  name: Eligibility and rules
  what: Whether a risk or a coverage is eligible, and which rule of the manual governs.
- kind: state-exceptions
  name: State exceptions
  what: Where the state's pages replace or delete the countrywide rule, renewal and rate capping included.
- kind: claims-made-erp
  name: Claims-made and tail
  what: Claims-made triggers, retroactive dates, maturity years and extended reporting premiums.
- kind: return-premium
  name: Return premium
  what: The premium returned or reduced on a cancellation, a suspension or a midterm change.
- kind: document-check
  name: Checking the filings
  what: The filing's own errors, told apart from passages that only look wrong.
you_get:
- title: Every test task
  detail: Each with the filed documents it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: underwriting-starter-table-lookup-02
