# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/federal-grants/1.0.1
title: Federal grants accounting under the Uniform Guidance
summary: 'Grants accounting under 2 CFR Part 200 at its 2024 amounts: allowable and indirect costs, cost sharing,
  program income, equipment, procurement, award dates and the single audit.'
description: 'Each task states the facts of an unnamed recipient''s Federal award: a budget, purchases, spending and
  dates. The AI reads the Office of Management and Budget''s rules for Federal awards, 2 CFR Part 200, and gives exact
  answers: modified total direct costs, which costs are allowable, what counts as cost sharing, a procurement method,
  whether an audit is required, or a due date. Every field of the answer is checked, and a task passes only when all
  of them are right.'
domain: Finance
group: finance
format: field-graded
status: draft
trade: grants accountants
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The regulation is a US
    government work.
upstream:
  name: 2 CFR Part 200, Uniform Administrative Requirements, Cost Principles, and Audit Requirements for Federal Awards
  by: Office of Management and Budget, as the eCFR shows it
  url: https://www.ecfr.gov/current/title-2/part-200
families:
- kind: cost-allowability
  name: Allowable costs
  what: Which charges the cost principles allow, where the text gives a clear rule or the answer turns on a fact the
    question states.
- kind: indirect-costs
  name: Indirect costs
  what: Modified total direct costs with every exclusion the definition lists, and indirect costs at the de minimis
    rate.
- kind: cost-sharing
  name: Cost sharing
  what: How much of the cash, in-kind contributions and unrecovered indirect costs on offer counts toward a cost
    sharing requirement.
- kind: program-income
  name: Program income
  what: What counts as program income, which method applies, and the arithmetic of the deduction, addition and cost
    sharing methods.
- kind: property
  name: Equipment and supplies
  what: Equipment or supplies by the capitalization threshold, the acquisition cost, and what is owed when the
    recipient disposes of them.
- kind: procurement
  name: Procurement
  what: The procurement method by amount, self-certified thresholds, bonding minimums and awards made without
    competition.
- kind: award-dates
  name: Award dates
  what: Closeout, financial reports, record retention, pre-award costs and a one-time extension, as dates.
- kind: audit-requirement
  name: Audit requirement
  what: Whether an audit is required, what counts as Federal awards expended, and the oversight agency for audit.
- kind: audit-deadline
  name: Audit deadlines
  what: The due date of the reporting package, moved off weekends and holidays where the rule says so, and the dates
    for the management decision and the auditor's records.
- kind: major-programs
  name: Major programs
  what: The Type A threshold, Type A and Type B programs, large loan programs, coverage and questioned costs.
you_get:
- title: Every test task
  detail: Each with the text of the regulation it needs, its answer key and the check that marks every field right or
    wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: federal-grants-closeout-01
