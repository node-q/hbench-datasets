# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/title-oh/1.0
title: Ohio title insurance rating
summary: 'Rate title insurance in Ohio from a filed schedule of rates: owner''s and loan premiums by band, minimums, reissue,
  refinance and simultaneous issue, endorsements, the actuarial memorandum and the errors in the filings.'
description: 'Each task gives the AI the filed schedule of rates of an Ohio title insurance rating organization, with its rate
  pages and actuarial memorandum, and states its facts in the question, such as the kind of policy and the amount of insurance.
  It asks for exact values: a premium, an amount, the rule that applies, a figure in the memorandum, or the errors in the
  filed pages themselves. Every field of the answer is checked, and a task passes only when all of them are right.'
domain: Insurance
format: field-graded
status: draft
trade: title underwriters
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays the
    filer's and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: band-math
  name: Premium by band
  what: Owner's and loan premiums by band, with the round-up to the next thousand and the edges of the bands.
- kind: minimum-premium
  name: Minimum premium
  what: Which minimum applies to a policy, also inside a reissue or a simultaneous issue.
- kind: homeowners
  name: Homeowner's policy
  what: The homeowner's policy loading, who may have the policy, and the reissue credit for a prior policy.
- kind: loan-policy
  name: Loan policies
  what: Expanded coverage and reissue loan policy premiums.
- kind: reissue
  name: Reissue
  what: The reissue rate up to the prior policy amount, the excess in its own bands, and who qualifies.
- kind: refinance
  name: Refinance
  what: Refinance rates on the unpaid balance and on the rest, and the ten-year line.
- kind: simultaneous-issue
  name: Simultaneous issue
  what: Owner's and loan policies issued together under the revised rule, with excess and aggregate loans.
- kind: endorsement
  name: Endorsements
  what: Endorsement premiums as a percentage of the right rate, with their minimums and maximums.
- kind: rule-selection
  name: Which rule applies
  what: Which reduced-rate rule applies, or none.
- kind: memo
  name: Actuarial memorandum
  what: The memorandum's proposed premiums, weighted changes and overall rate change, worked again from its own figures.
- kind: document-check
  name: Checking the filings
  what: The filings' own contradictions, such as a later page that differs from the manual, told apart from figures that
    are right.
you_get:
- title: Every test task
  detail: Each with the filed rate pages it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: title-oh-band-math-03
