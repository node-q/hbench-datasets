# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/treasury-auctions/1.0
title: US Treasury auctions
summary: 'Work with the US Treasury''s real auction results for bills, notes, bonds, TIPS and floating rate notes, and
  with the regulation that runs the auctions.'
description: 'Each task gives the AI the Treasury''s own auction records and the text of 31 CFR Part 356, the Uniform
  Offering Circular. It asks for exact answers, such as a bill''s price and discount, an award at the high rate, accrued
  interest, a TIPS index ratio and settlement amount, bid-to-cover and bidder shares, issuance and maturities, or whether
  the records agree with each other. Every field of the answer is checked, and a task passes only when all of them are
  right.'
domain: Finance
format: field-graded
status: draft
trade: fixed-income analysts
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The auction records and
    the regulation are US government works.
upstream:
  name: TreasuryDirect securities auction records, and 31 CFR Part 356, the Uniform Offering Circular
  by: US Department of the Treasury, Bureau of the Fiscal Service (TreasuryDirect); the regulation as the eCFR shows
    it
  url: https://www.treasurydirect.gov/auctions/
families:
- kind: bill-pricing
  name: Bill pricing
  what: A bill's price and discount from its discount rate, rounded the way the regulation says.
- kind: coupon-interest
  name: Coupon interest
  what: Interest payments, and the accrued interest on a reopened note or bond.
- kind: tips-indexing
  name: TIPS indexing
  what: The index ratio, adjusted values and settlement amount of a TIPS award, and real yields by term.
- kind: floating-rate
  name: Floating rate notes
  what: Spreads and discount margins in floating rate note auctions.
- kind: award-rules
  name: Award rules
  what: Awards to bids at the high rate, and the 35 percent limit on a single bidder.
- kind: auction-demand
  name: Auction demand
  what: Bid-to-cover ratios, and how far the high yield sits above the median.
- kind: bidder-allocation
  name: Bidder allocation
  what: What each class of bidder was awarded, how much of its bids that was, and noncompetitive awards.
- kind: issuance
  name: Issuance
  what: Par awarded by type of security, the Federal Reserve's add-on awards, and how long the securities run.
- kind: auction-calendar
  name: Auction calendar
  what: Days between auction and issue, CUSIPs auctioned again, and cash management bills.
- kind: document-check
  name: Data check
  what: Whether awarded amounts add up and types agree, and telling a change of record layout apart from an error.
you_get:
- title: Every test task
  detail: Each with the data it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: treasury-auctions-interest-payment-01
