# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/ratemaking-oh/1.0.1
title: General liability ratemaking from one Ohio filing
summary: 'Redo a real general liability rate indication filed in Ohio: development factors, ultimate losses, trend, loss
  ratios, the indicated rate change, Ohio''s loss cost multiplier and the places where the exhibits disagree.'
description: 'Each task gives the AI the filed documents of one real general liability rate filing made in Ohio, as text,
  and asks it to recompute, check or read exact values: age-to-age and age-to-ultimate factors, chain-ladder and Bornhuetter-Ferguson
  ultimates, trend factors and regressions, loss ratios and credibility, the indicated rate change and the loss cost multiplier,
  or the places where the exhibits disagree with each other or with their own notes. Every answer follows from the printed
  numbers and the formulas the filing states. Every field of the answer is checked, and a task passes only when all of
  them are right.'
domain: Insurance
group: insurance
format: field-graded
status: draft
trade: actuaries
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays
    the filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: age-to-age
  name: Age-to-age factors
  what: Development factors read from the right triangle, with evaluation dates turned into development ages.
- kind: averages
  name: Factor averages
  what: Volume-weighted and simple averages of development factors over the right number of years.
- kind: to-ultimate
  name: Age-to-ultimate factors
  what: Cumulative factors built from the selected factors and the selected tail.
- kind: ultimate
  name: Ultimate losses
  what: Chain-ladder, Bornhuetter-Ferguson and selected ultimates by accident quarter and accident year.
- kind: trend
  name: Trend
  what: Loss and premium trend factors and trended amounts, and trends fitted by exponential regression.
- kind: loss-ratio
  name: Loss ratios
  what: Attritional, ALAE and excess loss ratios, and class group relativities with their credibility.
- kind: indication
  name: Rate indication
  what: The countrywide indicated rate change, with the weights that reproduce the printed figures.
- kind: lcm
  name: Loss cost multiplier
  what: Ohio's expected loss ratio, loss cost multiplier and rate level changes.
- kind: filing-review
  name: Checking the filing
  what: Where the exhibits disagree with each other or with their own notes, and where they tie out.
you_get:
- title: Every test task
  detail: Each with the filed exhibits it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: ratemaking-oh-ata-alae-01
