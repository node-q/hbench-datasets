# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/us-life-tables/1.0
title: United States life tables, 2023 and 2024
summary: 'Actuarial sums on the US life tables of 2023 and 2024: survival, expectation of life, joint lives, insurance
  and annuity values, net premiums and reserves, and checks of the tables against themselves.'
description: 'Each task hands the AI the 36 complete period life tables that the National Center for Health Statistics
  published for 2023 and 2024, and the AI has to pick the right one by year, population and sex. The question states
  its facts, formulas and conventions, such as the interest rate and how to treat ages 100 and over. The AI gives exact
  answers: a probability, an expectation of life, a present value, a net premium or reserve, a column rebuilt from another,
  or something it finds in the tables. Every field of the answer is checked, and a task passes only when all of them
  are right.'
domain: Insurance
format: field-graded
status: draft
trade: actuaries
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The life tables are US government
    works.
upstream:
  name: United States Life Tables, 2024 and United States Life Tables, 2023 (National Vital Statistics Reports)
  by: Centers for Disease Control and Prevention (CDC), National Center for Health Statistics, National Vital Statistics
    System
  url: https://ftp.cdc.gov/pub/Health_Statistics/NCHS/Publications/NVSR/
families:
- kind: survival-probability
  name: Survival probability
  what: The chance of surviving or dying over several years or a deferred period, with an extra mortality where one is
    stated.
- kind: life-expectancy
  name: Expectation of life
  what: Complete, curtate and temporary expectations of life, and the median and most common ages at death.
- kind: fractional-age
  name: Fractional ages
  what: Probabilities between whole ages, under uniform deaths and under a constant force of mortality.
- kind: joint-lives
  name: Joint lives
  what: Probabilities and expectations for the first and the second death of two independent lives.
- kind: insurance-value
  name: Insurance value
  what: Present values of pure endowments, term, whole life and endowment insurances at a stated interest rate.
- kind: annuity-value
  name: Annuity value
  what: Present values of whole life, temporary, deferred and guaranteed annuities paid at the start of each year.
- kind: premium-reserve
  name: Premiums and reserves
  what: Net level annual premiums, and net premium reserves under the equivalence principle.
- kind: column-rebuild
  name: Column rebuild
  what: One column of a table rebuilt from another and checked against it at the precision the report prints.
- kind: table-comparison
  name: Table comparison
  what: Men against women, 2024 against 2023, and five populations against each other.
- kind: document-check
  name: Table check
  what: A table checked against itself, and how the files label the ages and the last age group.
you_get:
- title: Every test task
  detail: Each with the life tables it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: us-life-tables-pure-endowment-01
