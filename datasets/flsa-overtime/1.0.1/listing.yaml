# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/flsa-overtime/1.0.1
title: FLSA overtime and the regular rate
summary: 'Work out overtime pay under the US Department of Labor''s overtime regulation: the regular rate, the overtime
  due, and bonuses and commissions spread back over the weeks they were earned in.'
description: 'Each task describes one workweek of an unnamed employee: pay rates, hours, and any bonus, commission, piece
  rate or salary. The AI reads the regulation on overtime pay, 29 CFR Part 778, and gives exact answers, such as the regular
  rate, the overtime due, or whether a payment counts toward the regular rate. Every field of the answer is checked, and
  a task passes only when all of them are right.'
domain: Employment law
group: law-compliance
format: field-graded
status: draft
trade: payroll specialists
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The regulation is a US government
    work.
upstream:
  name: 29 CFR Part 778, Overtime Compensation
  by: US Department of Labor, Wage and Hour Division, as the eCFR shows it
  url: https://www.ecfr.gov/current/title-29/part-778
families:
- kind: hourly-rate
  name: Hourly pay
  what: The regular rate and overtime of an hourly employee, with differentials, bonuses, lodging and deductions.
- kind: salary-fixed-hours
  name: Salary for fixed hours
  what: A weekly, monthly or semimonthly salary turned into an hourly rate over the hours it is meant to cover.
- kind: piecework
  name: Piecework
  what: A pieceworker's regular rate over all hours worked, with waiting time, guarantees and bonuses.
- kind: day-and-job-rates
  name: Day and job rates
  what: The regular rate under day rates, job rates and a task-basis pay plan, and the premiums that count as overtime.
- kind: multiple-rates
  name: Several rates
  what: Overtime for an employee paid at two or more rates in one workweek.
- kind: fluctuating-workweek
  name: Fluctuating workweek
  what: Half-time overtime on a fixed salary for hours that vary, and when a fixed weekly sum is not what the books call
    it.
- kind: commissions
  name: Commissions
  what: A commission in the regular rate, allocated over the weeks or hours it was earned in.
- kind: bonuses
  name: Bonuses
  what: A bonus, prize or retroactive increase allocated over its period, and the extra overtime it brings.
- kind: exclusions-and-credits
  name: Exclusions and credits
  what: Which payments stay out of the regular rate, and which premiums may also be credited toward overtime.
- kind: workweek-unit
  name: The workweek
  what: Each workweek kept apart, a changed start of the workweek, and daily against weekly overtime standards.
you_get:
- title: Every test task
  detail: Each with the text of the regulation it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: flsa-overtime-day-rate-01
