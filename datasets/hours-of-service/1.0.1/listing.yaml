# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/hours-of-service/1.0.1
title: Commercial driver hours of service
summary: 'Check a truck or bus driver''s log against the US hours-of-service rules: driving and duty limits, rest breaks,
  weekly limits and restarts, sleeper berth splits, short-haul and bad weather exceptions.'
description: 'Each task gives an unnamed driver''s record of duty status as a table of time-stamped changes, says whether
  the vehicle carries goods or passengers, and states the facts of any exception. The AI reads the Federal Motor Carrier
  Safety Administration''s hours-of-service rules, 49 CFR Part 395, subpart A, and answers what they decide: total driving
  and on-duty time, the first minute of driving that is not allowed and the limit that forbids it, the time left, or whether
  a rest counts. Every field of the answer is checked to the minute, and a task passes only when all of them are right.'
domain: Transport
group: law-compliance
format: field-graded
status: draft
trade: fleet compliance managers
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The regulation is a US government
    work.
upstream:
  name: 49 CFR Part 395, Hours of Service of Drivers
  by: Federal Motor Carrier Safety Administration, US Department of Transportation, as the eCFR shows it
  url: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-395
families:
- kind: duty-totals
  name: Duty totals
  what: Driving, on-duty, sleeper berth and off-duty time totalled for the carrier's 24-hour period.
- kind: driving-limit
  name: Driving limit
  what: When the 11 hours of driving run out, and whether the rest before them was 10 consecutive hours.
- kind: duty-period
  name: Duty period
  what: When the 14-hour period ends, and when the 16-hour exemption may extend it.
- kind: rest-break
  name: Rest break
  what: Whether a 30-minute interruption was taken before 8 hours of driving, and what may make it up.
- kind: weekly-limit
  name: Weekly limit
  what: When 60 hours in 7 days or 70 in 8 are reached, across midnight and earlier days.
- kind: off-duty-rest
  name: Off-duty rest
  what: Which rest is 10 consecutive hours off duty, and whether a break is a 34-hour restart.
- kind: sleeper-berth
  name: Sleeper berth split
  what: Whether two sleeper berth periods pair, and the limits recalculated from the end of the first.
- kind: short-haul
  name: Short-haul exception
  what: Whether a day meets the short-haul exception's radius, return and release, and what follows when it does not.
- kind: adverse-conditions
  name: Adverse driving conditions
  what: Whether the two additional hours apply, by whether the conditions were known at dispatch.
- kind: passenger-carrier
  name: Passenger carriers
  what: The 10-hour driving and 15-hour on-duty limits of passenger-carrying vehicles, and their weekly limits.
you_get:
- title: Every test task
  detail: Each with the text of the regulation it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: hours-of-service-driving-limit-01
