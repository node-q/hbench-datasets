# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/medmal-oh/1.0.1
title: Ohio medical professional liability rating
summary: 'Rate Ohio physicians and surgeons from two insurers'' filed manuals: classes, territories, limits, claims-made
  and occurrence rates, tail coverage, credits, schedule rating, full premiums and one doctor at both insurers.'
description: 'Each task gives the AI the filed rating manuals, rate pages and exhibits of two insurers'' medical professional
  liability programs in Ohio, and states the facts in the question, such as a physician''s specialty, county and limits.
  It asks for exact values: a premium, a factor, a credit, a rule, a territory, or the errors in the documents themselves.
  Every field of the answer is checked, and a task passes only when all of them are right.'
domain: Insurance
group: insurance
format: field-graded
status: draft
trade: underwriters
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays
    the filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: premium-chain
  name: Full premium
  what: The whole rating at either insurer, through the specialty rate, limits, credits and caps, up to the final premium.
- kind: class-lookup
  name: Class lookup
  what: The right specialty class, code and rate, with other health professionals included.
- kind: territory
  name: Territory
  what: Each insurer's territory for a county, where the two group counties differently.
- kind: limits-factor
  name: Limits factor
  what: The factor for a limit the table lists, and what the manual says for one it does not.
- kind: claims-made-factor
  name: Claims-made and occurrence
  what: The claims-made year from a retroactive date, and each insurer's occurrence rate.
- kind: tail-erp
  name: Tail coverage
  what: Extended reporting period premiums, and when the tail is free on retirement or death.
- kind: practice-discount
  name: Practice credits
  what: Part-time, new to practice, training and leave of absence credits, and which of them combine.
- kind: premium-modification
  name: Premium modifications
  what: Claims-free, deductible, corporation and exposure credits and charges, held to the cap on total credits.
- kind: schedule-rating
  name: Schedule rating
  what: Schedule credits and debits held to their limits, with Ohio's limits in place of the countrywide plan's.
- kind: carrier-comparison
  name: Both insurers side by side
  what: The same physician rated at both insurers, each under its own rules.
- kind: document-check
  name: Checking the documents
  what: The filings' own errors, told apart from passages that only look wrong.
you_get:
- title: Every test task
  detail: Each with the filed pages it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: medmal-oh-compare-occurrence-01
