# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/pet-oh/1.0.1
title: Ohio pet insurance rating
summary: 'Rate pet health insurance in Ohio from one insurer''s two filed programs: breeds, age, area and plan factors,
  discounts and fees, full premiums, ways of paying, policy terms and the errors in the filings.'
description: 'Each task gives the AI the filed rate manuals of one insurer''s two pet insurance programs in Ohio and the
  policy form of one of them, and states the facts in the question, such as a dog''s breed, its age and the ZIP code. It
  asks for exact values: a premium, a factor, a breed group, a discount, a policy term, or the errors in the documents
  themselves. Every field of the answer is checked, and a task passes only when all of them are right.'
domain: Insurance
format: field-graded
status: draft
trade: underwriters
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays
    the filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: premium-chain
  name: Full premium
  what: The whole rating sequence, with base rate, breed, age, area and plan factors, discounts and fees, up to the final
    premium.
- kind: classification
  name: Breed classification
  what: The right species, breed group or life expectancy group for a named breed, a mix, or a mixed breed by weight.
- kind: age-factor
  name: Age factor
  what: Age factors at enrollment and at renewal, and the age bands used in rating.
- kind: area-factor
  name: Area factor
  what: State, ZIP and area factors, read from tables that are not in order.
- kind: plan-factor
  name: Plan factor
  what: Deductible, coinsurance, limit and copay factors, interpolated where the manual says to.
- kind: discount-fee
  name: Discounts and fees
  what: Which discounts a new policy can have, how they stack and cap, and where fees and optional benefits come in.
- kind: payment-mode
  name: Ways of paying
  what: Installment payments and the first year's cost for each way of paying.
- kind: policy-form
  name: Policy terms
  what: Waiting periods, pre-existing conditions, exclusions, cancellation, refunds and cost shares, as the policy form states
    them.
- kind: carrier-comparison
  name: The two programs side by side
  what: The same dog or cat rated in both programs, each under its own rules.
- kind: document-check
  name: Checking the documents
  what: The filings' own errors, told apart from passages that only look wrong.
you_get:
- title: Every test task
  detail: Each with the filed documents it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: pet-oh-program-b-chain-03
