# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/nist-800-53/1.0.1
title: NIST SP 800-53 Rev. 5 controls and baselines
summary: 'Count, compare and cross-check NIST''s security and privacy controls in its own machine-readable release: families,
  withdrawn controls, the LOW, MODERATE, HIGH and privacy baselines, tailoring, parameters and assessment procedures.'
description: 'Each task gives the AI tables of NIST''s control catalog, its four baselines and its assessment procedures,
  every value as NIST publishes it. The question states its facts, such as a system''s impact level, and defines the words
  it uses. The AI gives exact answers: how many controls and enhancements a family has, where a withdrawn control went,
  what one baseline adds over another, a tailored system''s control set, or whether two tables agree. Every field of the
  answer is checked, and a task passes only when all of them are right.'
domain: Security compliance
group: law-compliance
format: field-graded
status: draft
trade: security compliance analysts
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. NIST's control catalog and
    baselines are US government works, also dedicated to the public domain under CC0 1.0.
upstream:
  name: NIST SP 800-53 Rev. 5, SP 800-53A and SP 800-53B, OSCAL release (catalog version 5.2.0)
  by: National Institute of Standards and Technology (NIST), OSCAL content repository usnistgov/oscal-content
  url: https://github.com/usnistgov/oscal-content
families:
- kind: catalog-structure
  name: Catalog structure
  what: Base controls and enhancements in each family, active and withdrawn, and their implementation levels.
- kind: withdrawn-controls
  name: Withdrawn controls
  what: Which controls were withdrawn, whether they were moved or incorporated, and where they went.
- kind: control-links
  name: Control links
  what: Related and required links between controls, read in the right direction, one-way and mutual.
- kind: baseline-comparison
  name: Baseline comparison
  what: How big each baseline is, what one adds over another, the privacy baseline, and controls that no baseline includes.
- kind: baseline-consistency
  name: Baseline consistency
  what: Enhancements a baseline includes without their base control, and how much of related controls a baseline covers.
- kind: tailoring
  name: Tailoring
  what: A system's control set after the tailoring steps the question gives, applied in order.
- kind: parameters
  name: Parameters
  what: Organization-defined parameters by control and family, their selection choices, and parameters that group others.
- kind: control-text
  name: Control statements
  what: The items of the control statements, how they nest, and the parameter placeholders they hold.
- kind: assessment-procedures
  name: Assessment procedures
  what: Assessment methods and objectives, and the parts of a statement each objective assesses.
- kind: document-check
  name: Data check
  what: Whether identifiers, parameters and links agree with the controls table, without false alarms.
you_get:
- title: Every test task
  detail: Each with the data it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: nist-800-53-family-size-01
