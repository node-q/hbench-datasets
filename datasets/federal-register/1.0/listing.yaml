# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/federal-register/1.0
title: Federal Register rules and proposed rules, 2024 and 2025
summary: 'Research in real Federal Register rules and proposed rules of five agencies: find the documents that meet stated
  criteria, follow a rulemaking to its final rule, count comment periods and effective dates, and check records against texts.'
description: 'Every task gives the AI the same files: the Federal Register''s records of every rule and proposed rule that
  five federal agencies published in 2024 and 2025, 386 documents, and the published text of 89 of them. The agencies are
  the Internal Revenue Service, the Agricultural Marketing Service, the Office of Personnel Management, the Social Security
  Administration and the Pension Benefit Guaranty Corporation. Each question states its definitions and asks for exact answers,
  such as which documents meet the criteria, how long a comment period ran, which proposal led to which final rule, what a
  correction or a withdrawal refers to, what a rule''s text says about a budget or a penalty, and where the records and the
  texts disagree. Every field of the answer is checked, and a task passes only when all of them are right.'
domain: Regulatory research
format: field-graded
status: draft
trade: regulatory analysts
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The documents are US government
    works.
upstream:
  name: Federal Register rules and proposed rules, 2024 and 2025
  by: Office of the Federal Register (FederalRegister.gov API) and US Government Publishing Office (govinfo.gov)
  url: https://www.federalregister.gov
families:
- kind: document-search
  name: Finding documents
  what: The documents that meet stated criteria on agency, CFR part, title and action, including withdrawals traced through
    their Federal Register citations.
- kind: comment-periods
  name: Comment periods
  what: Comment periods counted from the dates, deadlines that precede publication, and extensions and reopenings matched
    to the proposal they prolong.
- kind: effective-dates
  name: Effective dates
  what: From publication to effect, rules in effect before they were published, and delays matched to the rules they delay.
- kind: rulemaking-history
  name: Rulemaking histories
  what: A rulemaking followed from proposal to final rule by regulation identifier number, docket and citation, with its intervals
    and figures.
- kind: corrections
  name: Corrections
  what: Correction documents told apart and matched to the documents they correct, from the records and from the texts.
- kind: corpus-statistics
  name: Counts and shares
  what: Documents and pages by month, day, agency and length, and the share marked significant, with each definition stated.
- kind: cfr-coverage
  name: CFR coverage
  what: Which titles and parts of the Code of Federal Regulations the documents concern, and which parts only rules or only
    proposals touch.
- kind: text-facts
  name: Facts from the texts
  what: Budgets, assessment rates, penalty amounts, employee counts and tables of spreads read from the rules' own texts.
- kind: document-check
  name: Record checks
  what: 'The records checked against themselves and against the texts: pages, citations, CFR parts and filing dates, without
    false alarms.'
you_get:
- title: Every test task
  detail: Each with the records and texts it searches, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: federal-register-history-01
