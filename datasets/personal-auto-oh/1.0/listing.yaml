# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/personal-auto-oh/1.0
title: Ohio personal auto rating
summary: 'Rate one private passenger auto program in Ohio from its filed rules, rate pages and symbol lists: vehicle symbols,
  garaging, driver and tier factors, rate steps, limits, discounts, fees and the filing''s own errors.'
description: 'Each task gives the AI the filed rules, rate pages, vehicle symbol lists and policy form of one personal auto
  program in Ohio, and states the facts in the question, such as a vehicle''s model and year, a driver''s insurance score
  or a given tier. It asks for exact values: a symbol, a factor, a partial premium in the filed rate order, a fee, a rule,
  or the errors in the documents themselves. Every field of the answer is checked, and a task passes only when all of them
  are right.'
domain: Insurance
format: field-graded
status: draft
trade: underwriters
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays
    the filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: vehicle-symbol
  name: Vehicle symbols
  what: The vehicle's symbol from the right symbol list, when the auxiliary symbol applies, and the factors keyed by it.
- kind: garaging
  name: Garaging
  what: Garaging factors by ZIP code and sales channel, and when a ZIP the table accepts is still refused under the rules.
- kind: driver-factor
  name: Driver factors
  what: The driver factor and the household risk factor, with violation points by coverage group.
- kind: fr-tier
  name: Insurance score tier
  what: The financial responsibility tier from an insurance score, at the edges of its bands, with no score or a thin file,
    and its factors.
- kind: tier-factor
  name: Tier factor
  what: The tier factor for a given tier and sales channel, read as the filing states it.
- kind: rate-chain
  name: Rate steps
  what: Partial premiums built step by step in the filed rate order.
- kind: limits-deductibles
  name: Limits and deductibles
  what: Limit and deductible factors by coverage, and the rules that pair limits.
- kind: discounts
  name: Discounts
  what: Which discounts apply and how they stack.
- kind: fees
  name: Fees
  what: Installment, filing, late, returned payment and policy fees for a pay plan.
- kind: term
  name: Policy term
  what: The policy term the rules allow and its pay plans.
- kind: rule-lookup
  name: Rule lookup
  what: Eligibility and classification rules, such as which vehicles are accepted, prior insurance and SR-22 filings.
- kind: form-rule
  name: Rules and the policy form
  what: What the rules and the policy form each say about a coverage or a cancellation.
- kind: document-check
  name: Checking the documents
  what: The filing's own inconsistencies, told apart from statements that are right.
you_get:
- title: Every test task
  detail: Each with the filed rules, rate pages and symbol lists it needs, its answer key and the check that marks every
    field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: personal-auto-oh-fees-01
