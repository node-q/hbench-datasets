# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/icd10cm-coding/1.0
title: ICD-10-CM diagnosis code set files
summary: 'Read the published ICD-10-CM files exactly: codes valid for submission and headers, how codes are built, the
  hierarchy, what changed between two annual releases, and whether the files agree with each other.'
description: 'Each task gives the AI lines of the real ICD-10-CM files as the US government publishes them, with the publisher''s
  own descriptions of their layout. It asks for exact answers, such as whether a code is valid for submission, how many
  codes sit under a header, which codes a release added or reworded, or where two files disagree. No task asks the AI to
  code a clinical record or apply a coding guideline. Every field of the answer is checked, and a task passes only when all
  of them are right.'
domain: Health compliance
format: field-graded
status: draft
trade: medical coders
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: 'Free to use, change and share, commercial use included, if you credit the source. ICD-10-CM itself is not covered:
    see the notice.'
upstream:
  name: ICD-10-CM, releases of October 1, 2025 (FY2026) and October 1, 2024 (FY2025)
  by: National Center for Health Statistics (NCHS) of the Centers for Disease Control and Prevention (CDC), as NCHS and the
    Centers for Medicare & Medicaid Services (CMS) publish them
  url: https://www.cdc.gov/nchs/icd/icd-10-cm/files.html
families:
- kind: code-lookup
  name: Code lookup
  what: Whether a code is valid for submission, in which release, and which code a long description belongs to.
- kind: valid-vs-header
  name: Valid codes and headers
  what: Codes valid for submission told apart from headers, by chapter, block and category.
- kind: code-structure
  name: Code structure
  what: Code length, the placeholder X, 7th characters and where the decimal point goes.
- kind: hierarchy
  name: Hierarchy
  what: Parents, categories and the valid codes under a header, followed from the codes themselves.
- kind: code-range
  name: Code ranges
  what: Which codes fall in a range by the order file's order numbers, including ranges that end on a header.
- kind: laterality-encounter
  name: Laterality and encounter
  what: Right and left pairs, laterality wording and the encounter types that 7th characters give.
- kind: description-length
  name: Descriptions
  what: Short and long descriptions, and how much the short ones abbreviate.
- kind: release-changes
  name: Release changes
  what: Codes added, removed and reworded between two annual releases, without being misled by renumbering.
- kind: addenda-reconciliation
  name: Addenda
  what: The publisher's change lists read correctly and checked against the files they describe.
- kind: file-consistency
  name: File consistency
  what: Whether the tabular list, the order file and the addenda agree, without raising false alarms.
you_get:
- title: Every test task
  detail: Each with the code set files it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: icd10cm-coding-code-lookup-01
