# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/noaa-storm-events/1.0.1
title: US storm events, 2024 and 2025
summary: 'Count, total and check NOAA''s US storm records for 2024 and 2025: events and episodes, damage written with K,
  M and B suffixes, deaths and injuries, tornado paths, hail and wind, and time zones.'
description: 'Each task gives the AI rows of NOAA''s Storm Events Database for 2024 or 2025, the National Weather Service''s
  record of storms, floods, hail, wind and other significant weather, with the deaths, injuries and damage estimates entered
  for each event. The question states its own definitions, such as an area, an event type or how an empty cell counts,
  and asks for exact figures: counts, damage totals, shares, rankings, averages and durations. Every field of the answer
  is checked, and a task passes only when all of them are right.'
domain: Natural hazards
group: research-data
format: field-graded
status: draft
trade: catastrophe modellers
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The storm records come from
    NOAA, an agency of the US government.
upstream:
  name: Storm Events Database
  by: NOAA National Centers for Environmental Information (NCEI), as entered by NOAA's National Weather Service
  url: https://www.ncei.noaa.gov/pub/data/swdi/stormevents/csvfiles/
families:
- kind: event-counts
  name: Event counts
  what: Events counted apart from episodes, and county rows apart from forecast zone rows, by month, area and type.
- kind: damage-amounts
  name: Damage amounts
  what: Property and crop damage read from amounts with K, M and B suffixes, with an empty cell kept apart from zero.
- kind: casualties
  name: Casualties
  what: Deaths and injuries summed by state, event type and class of tornado rating.
- kind: concentration
  name: Concentration
  what: How much of the damage or hail falls in a few areas, as shares, rankings and a Herfindahl index.
- kind: year-over-year
  name: Year over year
  what: Counts compared between years, between quarters and over a cold season, as the question defines them.
- kind: tornado-paths
  name: Tornado paths
  what: Tornado segments by rating, their lengths, widths and areas, and segments followed across county lines.
- kind: magnitudes
  name: Magnitudes
  what: Hail sizes and wind gusts read in the right unit, with measured gusts kept apart from estimated ones.
- kind: durations
  name: Durations and time
  what: How long events lasted, events that run a whole month, and local times turned into UTC with the offset given.
- kind: location-joins
  name: Location joins
  what: Events joined to their location points without counting any row twice.
- kind: document-check
  name: Data check
  what: Identifiers, dates, magnitudes and damage cells checked against each other, without false alarms.
you_get:
- title: Every test task
  detail: Each with the data it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: noaa-storm-events-events-episodes-01
