# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/farm-oh/1.0
title: Ohio farm property and liability rating
summary: 'Rate one insurer''s farmowners program in Ohio from the manual it filed: county zones, dwelling and outbuilding
  premiums, farm personal property, farm liability, deductibles, package rules and the manual''s stale pages.'
description: 'Each task gives the AI the farm property and liability manual one insurer filed in Ohio, with the filing''s
  actuarial memorandum, and states the facts in the question, such as a dwelling''s county and its amount of insurance.
  It asks for exact values: a zone, a credit, a premium, a rule, or the errors in the manual itself. Every field of the
  answer is checked, and a task passes only when all of them are right.'
domain: Insurance
format: field-graded
status: draft
trade: underwriters
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays
    the filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: zone-territory
  name: Zones and territory
  what: A county's zone after the territory change, mine subsidence by county, and rates that depend on the county.
- kind: dwelling-rating
  name: Dwelling rating
  what: Dwelling types and the construction, protection and age credits, applied in the manual's order.
- kind: coverage-table
  name: Dwelling and contents tables
  what: Dwelling and contents premiums read from the zone tables, with interpolation, add-ons, rounding and optional coverages.
- kind: outbuilding-fpp
  name: Outbuildings and farm property
  what: Outbuilding, special type and farm personal property premiums, blanket or scheduled, with their credits and minimums.
- kind: liability
  name: Farm liability
  what: Liability premiums by acreage, employees, residences, incidental business and higher limits.
- kind: deductible
  name: Deductibles
  what: Deductible factors and minimums, and what a deductible leaves alone.
- kind: premium-size
  name: Size of premium credit
  what: The size of premium credit tier at its boundaries, and the coverages it leaves out.
- kind: package-rule
  name: Package rules
  what: What the package includes, its rates and required sections, account credits, minimums and program tiers.
- kind: eligibility
  name: Eligibility
  what: Whether a dwelling, outbuilding or endorsement is eligible, and on what conditions.
- kind: document-check
  name: Checking the manual
  what: The manual's stale pages and inconsistencies, told apart from passages that are right.
you_get:
- title: Every test task
  detail: Each with the filed pages it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: farm-oh-zones-02
