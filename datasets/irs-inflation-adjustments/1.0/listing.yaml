# generated from it: python scripts/listing.py datasets/irs-inflation-adjustments/1.0
title: IRS inflation-adjusted tax amounts, 2025 and 2026
summary: 'Federal income tax work with the IRS''s yearly inflation adjustments: rate tables by filing status, the
  standard deduction, capital gains rates, the AMT exemption, the earned income credit, the kiddie tax, and gift and
  estate exclusions.'
description: 'Each task states an unnamed taxpayer''s facts, such as a filing status, a taxable income, an age or a
  gift. The AI reads the two revenue procedures that set the inflation-adjusted amounts for tax years 2025 and 2026,
  and gives exact answers: the tax from the rate table, a standard deduction, how a gain splits across the capital
  gains rates, an exemption as it phases out, a credit, or how an amount changed between the two years. Where a
  question needs a rule of the Internal Revenue Code that the documents do not restate, it writes the rule out. Every
  field of the answer is checked, and a task passes only when all of them are right.'
domain: Finance
format: field-graded
status: draft
trade: tax preparers
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The revenue procedures are
    US government works.
upstream:
  name: Rev. Proc. 2025-32 and Rev. Proc. 2024-40, Internal Revenue Bulletin
  by: Internal Revenue Service, US Department of the Treasury
  url: https://www.irs.gov/irb
families:
- kind: rate-table-tax
  name: Tax from the rate table
  what: The tax on a taxable income from the right rate table, for the filing status and year.
- kind: marginal-bracket
  name: Marginal brackets
  what: The bracket an income falls in at a threshold and just past it, and the tax on income that crosses one.
- kind: filing-status-lookup
  name: Filing status
  what: The right table and row for each filing status, and how one income fares under several.
- kind: standard-deduction
  name: Standard deduction
  what: The standard deduction with the extra amounts for age and blindness, for dependents, and as changed for 2025.
- kind: capital-gains
  name: Capital gains rates
  what: Where a gain falls across the zero, 15 and 20 percent rates, by filing status and year.
- kind: amt-exemption
  name: AMT exemption
  what: The alternative minimum tax exemption and its phaseout, and the tentative minimum tax.
- kind: earned-income-credit
  name: Earned income credit
  what: The credit as it phases in, levels off and phases out, and the investment income limit.
- kind: kiddie-tax
  name: Kiddie tax
  what: A child's net unearned income, the parents' election and the tax at the parents' rate.
- kind: transfer-tax
  name: Gift and estate
  what: The annual gift exclusion and its special amounts, and an estate above the basic exclusion amount.
- kind: year-over-year
  name: Year over year
  what: How amounts moved between 2025 and 2026, which fell, and which 2025 amounts a later document replaced.
you_get:
- title: Every test task
  detail: Each with the text of the revenue procedures it needs, its answer key and the check that marks every field
    right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: irs-inflation-adjustments-gift-exclusion-01
