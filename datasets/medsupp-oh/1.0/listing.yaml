# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/medsupp-oh/1.0
title: Ohio Medicare supplement rates and refunds
summary: 'Rate Medicare supplement plans in Ohio and check a refund calculation, from two insurers'' filings: rates by plan,
  age, sex and area, discounts, a rate increase exhibit, the NAIC refund calculation and the filings'' own errors.'
description: 'Each task gives the AI the text of one insurer''s filed rate page and actuarial memorandum and another insurer''s
  filed refund calculation, and states its facts in the question, such as an applicant''s age, county, plan and way of paying.
  It asks for exact answers: a monthly rate, a discount, a ratio, a line of an exhibit, whether a refund is due, or the errors
  in the documents themselves. Every field of the answer is checked, and a task passes only when all of them are right.'
domain: Insurance
format: field-graded
status: draft
trade: underwriters and actuaries
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The filings' own text stays the
    filers' and is not covered.
upstream:
  name: Ohio Department of Insurance, public filing records
  by: the filers, through the Ohio Department of Insurance
  url: https://filingaccess.serff.com/sfa/home/OH
families:
- kind: area-lookup
  name: Rating area
  what: The rating area of a county, including counties the page does not list and names that look alike.
- kind: rate-lookup
  name: Rate lookup
  what: The monthly rate by plan, attained age, sex and area, on the right form and under headings printed over each other.
- kind: payment-mode
  name: Payment mode and discounts
  what: Discounts for the way of paying and for two insureds in one home, and who qualifies for them.
- kind: age-band
  name: Attained age
  what: The change in rate at a birthday, and the age at which each table stops rising.
- kind: relativity
  name: Implied relativities
  what: The area and sex ratios the rate table implies, though the filing states none.
- kind: plan-availability
  name: Open and closed plans
  what: Which forms are open to new applicants, read through a heading printed over another.
- kind: exhibit-iii
  name: Rate development
  what: The memorandum's rate increase exhibit line by line, and the indicated increases the insurer did not take.
- kind: aggregate-increase
  name: Aggregate increase
  what: Whether the stated overall increase comes out again, weighted by premium or by membership.
- kind: refund-calc
  name: Refund calculation
  what: The steps of the NAIC refund calculation, through to the credibility tolerance and whether a refund is due.
- kind: document-check
  name: Checking the filings
  what: The filings' own errors, told apart from figures that only look wrong.
you_get:
- title: Every test task
  detail: Each with the filed documents it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: medsupp-oh-rate-lookup-01
