# What the Actuaria Market Place shows of this version (schema/listing.v1.json). listing.json is
# generated from it: python scripts/listing.py datasets/flight-duty/1.0.1
title: Pilot flight, duty and rest limits under FAA rules
summary: 'Check a pilot''s schedule against the US FAA''s flight and duty limits: flight time, duty periods, augmented crews,
  time zones, split duty, extensions, reserve, rest and night flying.'
description: 'Each task gives an unnamed pilot''s facts: where the pilot is acclimated, report time, flight legs and block
  times, the crew and its rest facility, earlier duty and rest, every time with its date and UTC offset. The AI reads the
  FAA''s flight and duty limits for flightcrew members, 14 CFR Part 117, with its Tables A, B and C, and answers what they
  decide, mostly to the minute: the limit that applies, how much is used and left, or whether a schedule is allowed. Every
  field of the answer is checked, and a task passes only when all of them are right.'
domain: Transport
format: field-graded
status: draft
trade: crew schedulers
licence:
  name: Creative Commons Attribution 4.0 (CC BY 4.0)
  summary: Free to use, change and share, commercial use included, if you credit the source. The regulation is a US government
    work.
upstream:
  name: '14 CFR Part 117, Flight and Duty Limitations and Rest Requirements: Flightcrew Members'
  by: Federal Aviation Administration, US Department of Transportation, as the eCFR shows it
  url: https://www.ecfr.gov/current/title-14/part-117
families:
- kind: flight-time
  name: Flight time
  what: The maximum flight time of Table A against scheduled and actual block times, with deadhead legs that count for none.
- kind: fdp-unaugmented
  name: Flight duty period
  what: 'The flight duty period limit of Table B: where the period starts and ends, which legs count and across time zones.'
- kind: fdp-augmented
  name: Augmented crews
  what: The limit of Table C by rest facility class and number of pilots, with the flight time and segment limits of an
    augmented crew.
- kind: acclimation
  name: Acclimation
  what: Whether a pilot is acclimated in a new theater, and the limit that follows.
- kind: split-duty
  name: Split duty
  what: Whether a rest during the duty period meets every condition of split duty, and what it does to the limit.
- kind: fdp-extension
  name: Extensions
  what: How far a flight duty period may be extended, how often, and when the extension must be reported.
- kind: reserve
  name: Reserve duty
  what: The limits of airport or standby, short-call and long-call reserve.
- kind: cumulative-limits
  name: Cumulative limits
  what: Flight time and flight duty period hours in the consecutive hours or calendar days that end at a given moment.
- kind: rest-period
  name: Rest
  what: The rest required before a report, in the past 168 hours, after a long trip and after a deadhead.
- kind: night-operations
  name: Night operations
  what: Which flight duty periods infringe on the window of circadian low, and how many may follow in a row.
you_get:
- title: Every test task
  detail: Each with the text of the regulation it needs, its answer key and the check that marks every field right or wrong.
- title: Free to use
  detail: Under CC BY 4.0, with credit to the source.
- title: Runs on your machine
  detail: Run it with the AI you choose in Actuaria Studio Essentials.
sample_task: flight-duty-rest-01
