name: Release dataset

# One run takes one or more dataset versions from their source release to the index (node-q/hbench-studio#390):
# it checks every set first, publishes each set's draft source release, publishes each set in turn with publish.yml,
# and updates the index once at the end. It never pushes a commit: a lock or a descriptor that is missing is
# committed in a pull request, and the run stops and says which one.

on:
  workflow_dispatch:
    inputs:
      sets:
        description: Sets to release in this order, as <set>@<version> separated by spaces or commas, such as federal-register@1.0 computer-use-browser@1.0
        required: true
        type: string
      hbench_version:
        description: node-q/hbench release that packs and pushes, such as v0.5.0
        required: true
        type: string
      dry_run:
        description: Only check the sets and say what would run; publish nothing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-dataset
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NAMESPACE: ghcr.io/node-q/hbench-datasets
  INDEX: ghcr.io/node-q/hbench-datasets/index
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  check:
    name: Check every set before anything is published
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Refuse anything but main
        env:
          HBENCH_VERSION: ${{ inputs.hbench_version }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error title=Not main::Datasets are released from main only, so that every descriptor is reviewed. Nothing was published."
            exit 1
          fi
          if ! [[ "$HBENCH_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Bad hbench version::The hbench_version input is not a release tag such as v0.5.0. Nothing was published."
            exit 1
          fi
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python packages
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check each descriptor is on main, valid for publishing, and has its images lock filled
        id: plan
        env:
          SETS: ${{ inputs.sets }}
          PYTHONPATH: scripts
        run: |
          if ! python scripts/release_plan.py --markdown "$RUNNER_TEMP/plan.md" "$SETS" > "$RUNNER_TEMP/plan.json" 2> "$RUNNER_TEMP/problems.txt"; then
            while read -r problem; do
              echo "::error title=Cannot release::$problem. Nothing was published."
            done < "$RUNNER_TEMP/problems.txt"
            exit 1
          fi
          {
            echo "plan=$(jq -c . "$RUNNER_TEMP/plan.json")"
            echo "matrix=$(jq -c '[.sets[] | {dataset, version}]' "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"
      - name: Install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      # publish.yml refuses an existing tag too; checking here stops the run before an earlier set is published.
      - name: Refuse a set the registry already serves
        run: |
          served=0
          while read -r dataset version; do
            if DOCKER_CONFIG="$(mktemp -d)" oras manifest fetch --descriptor "$NAMESPACE/$dataset:$version" > /dev/null 2>&1; then
              echo "::error title=Already published::$NAMESPACE/$dataset:$version already exists. Tags are never moved: release a new version. Nothing was published."
              served=$((served + 1))
            fi
          done < <(jq -r '.sets[] | "\(.dataset) \(.version)"' "$RUNNER_TEMP/plan.json")
          (( served == 0 ))
      - name: Write the plan to the job summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HBENCH_VERSION: ${{ inputs.hbench_version }}
        run: |
          {
            echo "## Release plan"
            echo
            if [[ "$DRY_RUN" == true ]]; then
              echo "Dry run: the checks below ran, and nothing is published."
            else
              echo "Each set is published in this order with node-q/hbench $HBENCH_VERSION, then the index is updated once."
            fi
            echo
            cat "$RUNNER_TEMP/plan.md" 2>/dev/null || echo "No plan: the inputs were refused."
          } >> "$GITHUB_STEP_SUMMARY"

  sources:
    name: Check and publish the source releases
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Draft releases are listed only to a token that can write contents.
    permissions:
      contents: write
    env:
      PLAN: ${{ needs.check.outputs.plan }}
    steps:
      - name: Check each source release exists, as a draft or published, with assets matching the pinned sha256
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' \
            | jq -c '{id, tag_name, draft, assets: [.assets[] | {id, name}]}' > "$RUNNER_TEMP/releases.jsonl"
          : > "$RUNNER_TEMP/drafts.txt"
          : > "$RUNNER_TEMP/release-states.txt"
          problems=0
          while read -r release; do
            set_ref="$(jq -r .set <<<"$release")"
            tag="$(jq -r .tag <<<"$release")"
            matches="$(jq -c --arg tag "$tag" 'select(.tag_name == $tag)' "$RUNNER_TEMP/releases.jsonl")"
            if [[ -z "$matches" || "$(wc -l <<<"$matches")" != 1 ]]; then
              echo "::error title=No source release::$set_ref downloads its source from the release $tag, which is not a single draft or published release of $GITHUB_REPOSITORY. Create it as a draft with the tarball from the export. Nothing was published."
              problems=$((problems + 1))
              continue
            fi
            release_id="$(jq -r .id <<<"$matches")"
            draft="$(jq -r .draft <<<"$matches")"
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              pinned="$(jq -r .sha256 <<<"$asset")"
              asset_id="$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)] | if length == 1 then .[0].id else empty end' <<<"$matches")"
              if [[ -z "$asset_id" ]]; then
                echo "::error title=Asset missing::The release $tag has no single asset named $name, which source.yaml of $set_ref downloads. Nothing was published."
                problems=$((problems + 1))
                continue
              fi
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/asset"
              actual="$(sha256sum "$RUNNER_TEMP/asset" | cut -d' ' -f1)"
              rm -f "$RUNNER_TEMP/asset"
              if [[ "$actual" != "$pinned" ]]; then
                echo "::error title=sha256 differs::$name in the release $tag has sha256 $actual, but source.yaml of $set_ref pins $pinned. Nothing was published."
                problems=$((problems + 1))
                continue
              fi
              echo "$set_ref: $tag/$name matches its pinned sha256 ($([[ "$draft" == true ]] && echo draft || echo published))."
            done < <(jq -c '.assets[]' <<<"$release")
            if [[ "$draft" == true ]]; then
              echo "$release_id $tag" >> "$RUNNER_TEMP/drafts.txt"
              echo "$tag draft" >> "$RUNNER_TEMP/release-states.txt"
            else
              echo "$tag published" >> "$RUNNER_TEMP/release-states.txt"
            fi
          done < <(jq -c '.sets[] | "\(.dataset)@\(.version)" as $set_ref | .releases[] | {set: $set_ref, tag, assets}' <<<"$PLAN")
          (( problems == 0 ))
          # Two sets of one run may share a release: publish it once.
          awk '!seen[$0]++' "$RUNNER_TEMP/drafts.txt" > "$RUNNER_TEMP/drafts-once.txt"
          {
            echo "## Source releases"
            echo
            if [[ ! -s "$RUNNER_TEMP/release-states.txt" ]]; then
              echo "None of these sets downloads its source from a release of this repository."
            else
              awk '!seen[$0]++ { print "- `" $1 "`: " $2 }' "$RUNNER_TEMP/release-states.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the draft source releases
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r release_id tag; do
            # A source release is never the repository's latest release: that stays a dataset release.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=false \
              --jq '"Published \(.tag_name): \(.html_url)"' | tee -a "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/drafts-once.txt"
      - name: Check each source downloads anonymously with its pinned sha256
        if: ${{ !inputs.dry_run }}
        run: |
          problems=0
          while read -r url pinned; do
            actual="$(curl --fail --silent --show-error --location --retry 5 --retry-all-errors "$url" | sha256sum | cut -d' ' -f1)"
            if [[ "$actual" != "$pinned" ]]; then
              echo "::error title=Source not served::$url does not download anonymously with sha256 $pinned (got $actual). Nothing was pushed to the registry."
              problems=$((problems + 1))
            fi
          done < <(jq -r '[.sets[].releases[].assets[] | "\(.url) \(.sha256)"] | unique | .[]' <<<"$PLAN")
          (( problems == 0 ))

  publish:
    name: Publish
    needs: [check, sources]
    if: ${{ !inputs.dry_run }}
    strategy:
      # One set at a time, in the order given; a failed set stops the sets after it.
      max-parallel: 1
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.check.outputs.matrix) }}
    uses: ./.github/workflows/publish.yml
    with:
      dataset: ${{ matrix.dataset }}
      version: ${{ matrix.version }}
      hbench_version: ${{ inputs.hbench_version }}
      update_index: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

  index:
    name: Update the dataset index
    needs: publish
    uses: ./.github/workflows/index.yml
    permissions:
      contents: read
      packages: write
      id-token: write

  summary:
    name: Write the release summary
    needs: [check, sources, publish, index]
    if: ${{ always() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PLAN: ${{ needs.check.outputs.plan }}
      DRY_RUN: ${{ inputs.dry_run }}
      SOURCES_RESULT: ${{ needs.sources.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      INDEX_RESULT: ${{ needs.index.result }}
    steps:
      - name: Install oras
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - name: Write the sets, their digests and their index entries to the job summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          no_credentials="$(mktemp -d)"
          echo '{"datasets": []}' > "$RUNNER_TEMP/index.json"
          if manifest="$(DOCKER_CONFIG="$no_credentials" oras manifest fetch "$INDEX:latest" 2>/dev/null)"; then
            DOCKER_CONFIG="$no_credentials" oras blob fetch --output "$RUNNER_TEMP/index.json" "$INDEX@$(jq -r '.layers[0].digest' <<<"$manifest")" 2>/dev/null || true
          fi
          {
            echo "## Released"
            echo
            if [[ "$DRY_RUN" == true ]]; then
              echo "Dry run: nothing was published. The table shows what the registry and the index serve now."
            else
              echo "Source releases: $SOURCES_RESULT. Publish: $PUBLISH_RESULT. Index: $INDEX_RESULT."
            fi
            echo
            echo "| Set | Source release | Manifest digest | Index entry |"
            echo "|---|---|---|---|"
            while read -r dataset version; do
              tags="$(jq -r --arg d "$dataset" --arg v "$version" '.sets[] | select(.dataset == $d and .version == $v) | [.releases[].tag] | join(" ")' <<<"$PLAN")"
              releases=""
              for tag in $tags; do
                if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > /dev/null 2>&1; then
                  releases+="\`$tag\` published "
                else
                  releases+="\`$tag\` not published "
                fi
              done
              digest="$(DOCKER_CONFIG="$no_credentials" oras resolve "$NAMESPACE/$dataset:$version" 2>/dev/null || true)"
              entry="$(jq -r --arg d "$dataset" --arg v "$version" '.datasets[] | select(.name == $d and .version == $v) | .digest' "$RUNNER_TEMP/index.json")"
              [[ -n "$digest" ]] && digest="\`$digest\`" || digest="not served"
              [[ -n "$entry" ]] && entry="\`$entry\`" || entry="not listed"
              echo "| \`$dataset@$version\` | ${releases:-none} | $digest | $entry |"
            done < <(jq -r '.sets[] | "\(.dataset) \(.version)"' <<<"$PLAN")
            if [[ "$DRY_RUN" != true && "$PUBLISH_RESULT" != success ]]; then
              echo
              echo "**Not every set was published**, so the index was not updated. Sets above with a digest are published. Fix the failed set (its publish job's summary says whether a package version must be deleted), then run Release dataset for the sets that are left, or run Index alone."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
