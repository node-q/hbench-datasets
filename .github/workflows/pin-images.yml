name: Pin images

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset whose upstream environment images to pin by digest, as in datasets/<dataset>/<version>
        required: true
        type: string
      version:
        description: Version whose tasks declare the images to pin, such as 1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pin-images-${{ inputs.dataset }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DATASET: ${{ inputs.dataset }}
  VERSION: ${{ inputs.version }}

jobs:
  pin:
    name: Pin ${{ inputs.dataset }}@${{ inputs.version }}'s upstream images by digest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse malformed inputs
        run: |
          if ! [[ "$DATASET" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ && "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error title=Bad inputs::The dataset or version input is malformed."
            exit 1
          fi
          if [[ ! -f "datasets/$DATASET/$VERSION/source.yaml" ]]; then
            echo "::error title=No descriptor::datasets/$DATASET/$VERSION/source.yaml does not exist on $GITHUB_REF_NAME."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python packages
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Resolve each task's image tag to its digest with a HEAD request
        run: |
          mkdir "$RUNNER_TEMP/lock"
          python scripts/pin_images.py "datasets/$DATASET/$VERSION/source.yaml" "$RUNNER_TEMP/source" \
            --output "$RUNNER_TEMP/lock/images.lock.json"
      - name: Upload images.lock.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/lock/images.lock.json
          archive: false
          if-no-files-found: error
          overwrite: true
      - name: Write the lock to the job summary
        run: |
          {
            echo "## Upstream images of $DATASET@$VERSION, pinned by digest"
            echo
            echo "- Images: $(jq length "$RUNNER_TEMP/lock/images.lock.json"), each resolved from its tag with a registry HEAD request"
            echo
            echo "Commit this as \`images.lock.json\` in the $DATASET version whose environment policy is \`pinned-upstream\`."
            echo
            echo '```json'
            cat "$RUNNER_TEMP/lock/images.lock.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
