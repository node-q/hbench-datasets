name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  descriptors:
    name: Descriptors and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python packages
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Validate every source.yaml, its LICENSE, NOTICE and SPDX id
        run: python scripts/validate_sources.py
      - name: Run the unit tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover --start-directory tests --verbose

  sources:
    name: Fetch each source at its pinned commit
    needs: descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python packages
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Fetch every dataset version's task directories and pin their images from their locks
        run: |
          for descriptor in datasets/*/*/source.yaml; do
            version_directory="${descriptor%/source.yaml}"
            destination="$RUNNER_TEMP/sources/${version_directory#datasets/}"
            mkdir -p "$(dirname "$destination")"
            python scripts/fetch_source.py --allow-unfilled-lock "$descriptor" "$destination"
          done
