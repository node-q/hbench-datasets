name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  descriptors:
    name: Descriptors and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python packages
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Validate every source.yaml, its LICENSE, NOTICE and SPDX id
        run: python scripts/validate_sources.py
      - name: Check the environment images and the bases they start from
        run: python scripts/environment_images.py check
      - name: Run the unit tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover --start-directory tests --verbose

  sources:
    name: Fetch each source at its pinned commit
    needs: descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python packages
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Fetch every dataset version's task directories and pin their images from their locks
        run: |
          for descriptor in datasets/*/*/source.yaml; do
            version_directory="${descriptor%/source.yaml}"
            destination="$RUNNER_TEMP/sources/${version_directory#datasets/}"
            mkdir -p "$(dirname "$destination")"
            python scripts/fetch_source.py --allow-unfilled-lock "$descriptor" "$destination"
          done

  generated:
    name: Generate each generated dataset twice and check every task
    needs: descriptors
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HBENCH_VERSION: v0.2.6
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Python packages
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install hbench, verifying SHA256SUMS and its build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-hbench.sh "$HBENCH_VERSION" "$RUNNER_TEMP/hbench"
      - name: Generate every generated dataset version twice, checking it against its generated.lock.json and hbench
        run: |
          python scripts/check_generated_tasks.py \
            --output "$RUNNER_TEMP/generated" \
            --upstream-cache "$RUNNER_TEMP/upstream" \
            --hbench "$RUNNER_TEMP/hbench/hbench"
      - name: Upload the generated.lock.json each generated version would have, when one differs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-locks
          path: ${{ runner.temp }}/generated/*/*/first/generated.lock.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Run every task's checker on its oracle and on a wrong solution, in the image's base once it can be pulled
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          mapfile -t generated_versions < <(python scripts/check_generated_tasks.py --list --policy built)
          for generated_version in "${generated_versions[@]}"; do
            read -r name version adapter image <<<"$generated_version"
            if [[ "$adapter" == bigcodebench ]]; then
              echo "$name@$version needs its built image: the BigCodeBench workflow checks it."
              continue
            fi
            tasks="$RUNNER_TEMP/generated/$name/$version/first/tasks"
            base="$(python scripts/environment_images.py base-of "$image")"
            if docker pull --quiet "$base" > /dev/null 2>&1; then
              echo "Checking $name@$version in $base"
              docker run --rm --network none \
                --volume "$PWD:/repository:ro" --volume "$tasks:/tasks:ro" \
                --workdir /repository --env PYTHONDONTWRITEBYTECODE=1 \
                "$base" python3 -m adapters.verify "$adapter" /tasks --jobs "$(nproc)" < /dev/null
            else
              echo "::notice title=Base image not pullable yet::$base cannot be pulled, so $name@$version is checked with the runner's Python 3.12."
              python -m adapters.verify "$adapter" "$tasks" --jobs "$(nproc)" < /dev/null
            fi
          done
